name: Check coding style

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  KERNEL_TOOLS_TAG: v7.0
  # Hosted runner headers are unrelated to the target driver kernel.
  KSRC: /nonexistent/fl2000-ci-headers

jobs:
  style:
    name: ${{ matrix.tool }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        tool: [clang-format, checkpatch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        if: matrix.tool == 'clang-format'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format-18
      - name: Run check
        env:
          STYLE_TOOL: ${{ matrix.tool }}
          CLANG_FORMAT: clang-format-18
        run: |
          if [[ "$STYLE_TOOL" == clang-format ]]; then
            scripts/clang-format.sh --dry-run 2>&1 | tee style.log
          else
            scripts/checkpatch.sh 2>&1 | tee style.log
          fi
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: style-${{ matrix.tool }}
          path: style.log
          if-no-files-found: ignore
          retention-days: 7
