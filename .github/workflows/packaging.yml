name: Ubuntu packages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  packaging:
    name: Ubuntu 26.04 / amd64
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install packaging dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dh-dkms dkms lintian python3 shellcheck \
            xz-utils linux-headers-generic libdw1t64 kmod git
      - name: Build and check packages
        run: tests/packaging_ci.sh "$GITHUB_WORKSPACE" /tmp/fl2000-packaging-ci
      - name: Save packages and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubuntu-26.04-packages
          path: |
            /tmp/fl2000-packaging-ci/*.deb
            /tmp/fl2000-packaging-ci/*.dsc
            /tmp/fl2000-packaging-ci/*.tar.xz
            /tmp/fl2000-packaging-ci/*.changes
            /tmp/fl2000-packaging-ci/*.buildinfo
            /tmp/fl2000-packaging-ci/*.log
            /tmp/fl2000-packaging-ci/dkms/**/log/*.log
          if-no-files-found: warn
          retention-days: 7
