name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      BUILD_WRAPPER_OUT_DIR: .sonar
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Check analysis configuration
        id: configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SonarCloud skipped: SONAR_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install build and analysis dependencies
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git gnupg \
            linux-headers-generic libdw1t64 python3 unzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configuration.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Build Wrapper
        id: wrapper
        if: steps.configuration.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      - name: Capture a clean Linux 7.0 build
        if: steps.configuration.outputs.enabled == 'true'
        env:
          BUILD_WRAPPER: ${{ steps.wrapper.outputs.build-wrapper-binary }}
        run: |
          ksrc=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-7.0.*-generic' | sort -V | tail -n 1)
          test -n "$ksrc"
          scripts/fetch-bridge-connector.sh
          mkdir -p "$BUILD_WRAPPER_OUT_DIR"
          for backend in auto bmi2; do
            make -C "$ksrc" M="$GITHUB_WORKSPACE" clean
            "$BUILD_WRAPPER" --out-dir "$BUILD_WRAPPER_OUT_DIR/$backend" \
              make -C "$ksrc" M="$GITHUB_WORKSPACE" \
                FL2000_FRAME_BACKEND="$backend" W=1 KCFLAGS=-Werror modules
          done
          python3 tests/compile_commands.py \
            "$BUILD_WRAPPER_OUT_DIR/auto/compile_commands.json" \
            "$BUILD_WRAPPER_OUT_DIR/bmi2/compile_commands.json" \
            --output "$BUILD_WRAPPER_OUT_DIR/compile_commands.json"
      # Kernel callback signatures cannot gain pointer-to-const qualifiers.
      # Keep this exception outside the upstreamable source. Only S995 is
      # excluded, scoped to the three files containing affected callbacks.
      - name: Run SonarQube Cloud analysis
        if: steps.configuration.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.projectKey=klogg_fl2000_drm
            -Dsonar.organization=klogg
            -Dsonar.projectName=fl2000_drm
            -Dsonar.sources=.
            -Dsonar.tests=tests
            -Dsonar.exclusions=tests/**,.github/**,**/*.mod.c
            -Dsonar.issue.ignore.multicriteria=drmCallbackConst,i2cCallbackConst,bridgeCallbackConst
            -Dsonar.issue.ignore.multicriteria.drmCallbackConst.ruleKey=c:S995
            -Dsonar.issue.ignore.multicriteria.drmCallbackConst.resourceKey=fl2000_drm.c
            -Dsonar.issue.ignore.multicriteria.i2cCallbackConst.ruleKey=c:S995
            -Dsonar.issue.ignore.multicriteria.i2cCallbackConst.resourceKey=fl2000_i2c.c
            -Dsonar.issue.ignore.multicriteria.bridgeCallbackConst.ruleKey=c:S995
            -Dsonar.issue.ignore.multicriteria.bridgeCallbackConst.resourceKey=bridge/it66121_drv.c
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.cfamily.compile-commands=${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
