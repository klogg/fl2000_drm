name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and analyze
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 30
    env:
      BUILD_WRAPPER_OUT_DIR: .sonar
    steps:
      - name: Check analysis configuration
        id: configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -n "$SONAR_TOKEN" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'SonarCloud skipped: SONAR_TOKEN is not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install compiler and Linux 7.0 headers
        if: steps.configuration.outputs.enabled == 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git linux-headers-generic
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configuration.outputs.enabled == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Build Wrapper
        id: wrapper
        if: steps.configuration.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      - name: Capture a clean Linux 7.0 build
        if: steps.configuration.outputs.enabled == 'true'
        env:
          BUILD_WRAPPER: ${{ steps.wrapper.outputs.build-wrapper-binary }}
        run: |
          ksrc=$(find /usr/src -maxdepth 1 -type d -name 'linux-headers-7.0.*-generic' | sort -V | tail -n 1)
          test -n "$ksrc"
          make -C "$ksrc" M="$GITHUB_WORKSPACE" clean
          "$BUILD_WRAPPER" --out-dir "$BUILD_WRAPPER_OUT_DIR" \
            make -C "$ksrc" M="$GITHUB_WORKSPACE" W=1 KCFLAGS=-Werror modules
          test -s "$BUILD_WRAPPER_OUT_DIR/compile_commands.json"
      - name: Run SonarQube Cloud analysis
        if: steps.configuration.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
