# Settings apply to one service invocation on one adapter.
adapter_name FL2000 bridge I2C bus
bind_timeout 10

# bridge TYPE MODULE DRIVER ADDRESSES REGISTER:MASK:VALUE[,REGISTER:MASK:VALUE...]
# Addresses and identity bytes use two-digit hexadecimal notation.
# Only documented read-only ID registers belong in these checks.
bridge it66121 it66121 it66121 0x4c,0x4d 0x00:0xff:0x54,0x01:0xff:0x49,0x02:0xff:0x12,0x03:0x0f:0x06
