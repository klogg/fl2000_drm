sonar.projectKey=klogg_fl2000_drm
sonar.organization=klogg
sonar.host.url=https://sonarcloud.io

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=fl2000_drm
sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,.github/**,.sonar/**,.qemu-build/**,.cache/**,**/*.mod.c,**/*.mod,**/*.ko,**/*.o

# Compilation database from the current Build Wrapper
sonar.cfamily.compile-commands=.sonar/compile_commands.json

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
